<nav class="navbar bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <i class="bi bi-robot" aria-hidden="true"></i>
      Andes Agents
    </a>
    <app-theme-toggle />
  </div>
</nav>
<main class="container py-4">
  @if (auth.status() === 'failed') {
    <div class="alert alert-danger d-flex flex-wrap align-items-center gap-3" role="alert">
      <span class="me-auto">Sign-in could not be completed ({{ auth.errorCode() }}).</span>
      <button type="button" class="btn btn-danger btn-sm" (click)="auth.retrySignIn()">
        Try again
      </button>
    </div>
  } @else {
    <router-outlet />
  }
</main>
